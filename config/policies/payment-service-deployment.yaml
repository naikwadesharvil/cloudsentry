apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: production
  labels:
    app: payment-service
    tier: billing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-api
          image: ghcr.io/org/payment-service:v3.1.0
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: STRIPE_CONNECT_TIMEOUT_MS
              value: "5000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
